<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facilitador - Hennings Academy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { navy: { 800: '#1e293b', 900: '#0f172a', 950: '#020617' }, mustard: { 400: '#fbbf24', 500: '#f59e0b', 600: '#d97706' } },
                    animation: { 'fade-in': 'fadeIn 0.6s ease-out forwards', 'slide-up': 'slideUp 0.6s ease-out forwards', 'blob': 'blob 10s infinite alternate', 'float': 'float 6s ease-in-out infinite' },
                    keyframes: {
                        fadeIn: { '0%': { opacity: 0 }, '100%': { opacity: 1 } },
                        slideUp: { '0%': { opacity: 0, transform: 'translateY(20px)' }, '100%': { opacity: 1, transform: 'translateY(0)' } },
                        blob: { '0%': { transform: 'translate(0px, 0px) scale(1)' }, '33%': { transform: 'translate(30px, -50px) scale(1.1)' }, '66%': { transform: 'translate(-20px, 20px) scale(0.9)' }, '100%': { transform: 'translate(0px, 0px) scale(1)' } },
                        float: { '0%, 100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-10px)' } }
                    }
                }
            }
        }
    </script>
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #020617; overflow: hidden; }
        .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; } 
        .custom-scroll::-webkit-scrollbar-track { background: transparent; } 
        .custom-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        .tab-btn { @apply px-6 py-3 rounded-2xl text-[10px] font-black uppercase tracking-[0.1em] text-gray-500 hover:text-white transition-all whitespace-nowrap flex items-center gap-2; }
        .tab-active { @apply bg-mustard-500 text-navy-950 shadow-[0_0_20px_rgba(245,158,11,0.4)] hover:text-navy-950; }
        select option { background-color: #0f172a; color: white; }
    </style>

    <style type="text/tailwindcss">
        .input-clean { @apply w-full bg-navy-900/50 border border-white/10 text-white rounded-2xl px-5 py-3.5 text-sm outline-none transition-all duration-300 placeholder-gray-500 backdrop-blur-md hover:border-white/20 focus:bg-navy-900/80 focus:border-mustard-500/50 focus:shadow-[0_0_20px_rgba(245,158,11,0.15)]; }
        .label-clean { @apply block text-[10px] text-gray-400 uppercase tracking-[0.15em] mb-2 ml-1 font-bold; }
    </style>
</head>
<body class="text-gray-300 antialiased h-screen flex flex-col selection:bg-mustard-500 selection:text-navy-950">

    <!-- LUZES AMBIENTAIS -->
    <div class="fixed inset-0 z-0 overflow-hidden pointer-events-none">
        <div class="absolute top-[-10%] left-[-10%] w-[50vw] h-[50vw] bg-indigo-600/20 rounded-full mix-blend-screen filter blur-[120px] opacity-80 animate-blob"></div>
        <div class="absolute bottom-[-20%] right-[-10%] w-[60vw] h-[60vw] bg-blue-800/20 rounded-full mix-blend-screen filter blur-[120px] opacity-80 animate-blob" style="animation-delay: 2s;"></div>
    </div>

    <!-- OVERLAY DE CARREGAMENTO -->
    <div id="loadingOverlay" class="fixed inset-0 bg-navy-950/80 z-[999] flex flex-col items-center justify-center hidden backdrop-blur-xl transition-all duration-300">
        <div class="bg-navy-900/50 p-10 rounded-[2rem] border border-white/10 flex flex-col items-center shadow-2xl animate-slide-up">
            <i data-lucide="loader-2" class="w-12 h-12 animate-spin text-mustard-500 mb-4"></i>
            <h2 id="loadingText" class="text-xs font-black tracking-widest uppercase text-white bg-clip-text text-transparent bg-gradient-to-r from-mustard-400 to-mustard-600">Afiando as ferramentas DHO...</h2>
        </div>
    </div>

    <div id="app-shell" class="flex-1 h-screen w-full flex flex-col lg:flex-row overflow-hidden relative z-20">
        
        <!-- MAIN CONTENT -->
        <div class="flex-1 flex flex-col h-full overflow-hidden p-6 lg:p-10">
            <!-- NAVEGAÇÃO SUPERIOR -->
            <div class="flex flex-col xl:flex-row gap-6 mb-8 items-start xl:items-center w-full justify-between border-b border-white/10 pb-6">
                <nav id="mainNav" class="flex gap-3 bg-navy-900/40 backdrop-blur-2xl p-2.5 rounded-[1.5rem] border border-white/10 shadow-[0_10px_30px_rgba(0,0,0,0.3)] overflow-x-auto w-full xl:w-auto">
                    <button id="tab-ativos" onclick="HA.Facilitator.switchTab('ativos')" class="tab-active tab-btn"><i data-lucide="rocket" class="w-4 h-4"></i> Em Voo</button>
                    <button id="tab-fins" onclick="HA.Facilitator.switchTab('fins')" class="tab-btn"><i data-lucide="award" class="w-4 h-4"></i> Salão da Fama</button>
                    <button id="tab-colabs" onclick="HA.Facilitator.switchTab('colabs')" class="tab-btn"><i data-lucide="users" class="w-4 h-4"></i> Base de Talentos</button>
                    <button id="tab-inbox" onclick="HA.Facilitator.switchTab('inbox')" class="tab-btn relative"><i data-lucide="mail" class="w-4 h-4"></i> Radar Liderança</button>
                </nav>

                <div class="relative w-full xl:w-80 group">
                    <i data-lucide="search" class="absolute left-5 top-4 w-4 h-4 text-gray-500 group-focus-within:text-mustard-400 transition-colors"></i>
                    <input type="text" id="globalSearch" placeholder="Rastrear registros..." class="w-full bg-navy-900/40 backdrop-blur-xl border border-white/10 rounded-2xl pl-12 pr-5 py-4 text-xs font-bold focus:border-mustard-500 focus:bg-white/5 outline-none text-white transition-all shadow-[0_10px_30px_rgba(0,0,0,0.2)] placeholder-gray-500 tracking-widest">
                </div>
            </div>

            <!-- ÁREA DINÂMICA DE TELAS -->
            <main id="main-content" class="flex-1 overflow-y-auto custom-scroll pr-4 space-y-8 pb-12">
                
                <!-- VIEW: TRAY (Bandeja de Treinamentos) -->
                <div id="view-tray" class="block max-w-[1400px] mx-auto">
                    <div class="flex flex-col md:flex-row justify-between items-center gap-4 mb-8">
                        <div>
                            <h2 class="text-3xl font-black text-white tracking-widest uppercase flex items-center gap-3" id="tray-title"><i data-lucide="swords" class="text-mustard-500 w-8 h-8"></i> Campo de Treinamento</h2>
                            <p class="text-[10px] text-mustard-500 uppercase tracking-[0.3em] mt-1 font-bold ml-11" id="tray-subtitle">Onde grandes talentos são forjados</p>
                        </div>
                        <button onclick="HA.UI.openTrainingModal()" class="bg-gradient-to-r from-mustard-500 to-mustard-400 text-navy-950 px-8 py-4 rounded-2xl text-[10px] font-black uppercase tracking-[0.15em] hover:scale-105 active:scale-95 transition-all shadow-[0_10px_30px_-10px_rgba(245,158,11,0.8)] flex items-center gap-2">
                            <i data-lucide="sparkles" class="w-4 h-4"></i> Criar Nova Magia
                        </button>
                    </div>
                    <div class="bg-navy-900/40 backdrop-blur-2xl rounded-[2.5rem] shadow-[0_20px_40px_rgba(0,0,0,0.5)] border border-white/10 overflow-hidden">
                        <div class="overflow-x-auto p-2">
                            <table class="w-full text-left text-sm text-gray-300">
                                <thead class="text-gray-500 text-[9px] font-black uppercase tracking-[0.2em] border-b border-white/5">
                                    <tr><th class="px-6 py-5 font-bold w-12 text-center">ST.</th><th class="px-6 py-5 font-bold">Colaborador</th><th class="px-6 py-5 font-bold">Setor / Área</th><th class="px-6 py-5 font-bold w-1/4">Progresso</th><th class="px-6 py-5 font-bold text-right">Prazos</th><th class="px-6 py-5 font-bold text-right">Ações</th></tr>
                                </thead>
                                <tbody id="table-tray" class="divide-y divide-white/5"></tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- VIEW: COLABS (Base) -->
                <div id="view-colabs" class="hidden max-w-[1400px] mx-auto">
                    <div class="flex justify-between items-end mb-8 border-b border-white/10 pb-6">
                        <div>
                            <h2 class="text-3xl font-black text-white tracking-widest uppercase flex items-center gap-3"><i data-lucide="users" class="text-indigo-500 w-8 h-8"></i> Base de Talentos</h2>
                            <p class="text-[10px] text-indigo-400 uppercase tracking-[0.3em] mt-1 font-bold ml-11">Gerenciamento de Perfis DHO</p>
                        </div>
                        <button onclick="HA.Facilitator.openColabModal()" class="bg-indigo-500/20 hover:bg-indigo-500/40 text-indigo-300 border border-indigo-500/30 px-6 py-3 rounded-2xl text-[10px] font-black uppercase tracking-[0.2em] transition-all flex items-center gap-2 shadow-sm hover:scale-105">
                            <i data-lucide="user-plus" class="w-4 h-4"></i> Adicionar Perfil
                        </button>
                    </div>
                    <div id="colabGroupedContainer" class="space-y-10 pb-10"></div>
                </div>

                <!-- VIEW: INBOX -->
                <div id="view-inbox" class="hidden max-w-[1400px] mx-auto">
                    <div class="grid grid-cols-1 xl:grid-cols-2 gap-10">
                        <div><h2 class="text-sm font-black text-mustard-500 mb-5 border-b border-white/10 pb-4 uppercase tracking-[0.2em] flex items-center gap-3"><i data-lucide="file-plus" class="w-5 h-5"></i> Pedidos de Líderes</h2><div id="inbox-requests" class="space-y-5"></div></div>
                        <div><h2 class="text-sm font-black text-indigo-400 mb-5 border-b border-white/10 pb-4 uppercase tracking-[0.2em] flex items-center gap-3"><i data-lucide="bell" class="w-5 h-5"></i> Avisos e Retornos</h2><div id="inbox-notifs" class="space-y-5"></div></div>
                    </div>
                </div>

            </main>
        </div>

        <!-- RIGHT SIDEBAR -->
        <aside class="w-full lg:w-[360px] bg-navy-950/40 backdrop-blur-3xl border-l border-white/5 p-8 flex flex-col shadow-[-20px_0_50px_rgba(0,0,0,0.5)] z-30 overflow-y-auto custom-scroll">
            <div class="w-full flex justify-center mb-12 animate-float">
                <img src="assets/logo.png" alt="Hennings Academy" class="h-10 object-contain drop-shadow-xl" onerror="this.outerHTML='<h1 class=\\'text-xl font-black text-white\\'>HENNINGS<span class=\\'text-mustard-500\\'>ACADEMY</span></h1>';">
            </div>

            <div class="w-full bg-gradient-to-br from-emerald-900/40 to-navy-900/40 border border-emerald-500/30 rounded-[2rem] p-5 flex items-center gap-5 shadow-[0_10px_30px_rgba(16,185,129,0.15)] mb-10 relative overflow-hidden group hover:border-emerald-400/60 transition-colors">
                <div class="absolute top-0 left-0 w-2 h-full bg-emerald-500 shadow-[0_0_15px_rgba(16,185,129,1)]"></div>
                <div class="flex-1 pl-3">
                    <h3 class="text-white font-black text-sm tracking-wide" id="userNameDisplay">Carregando...</h3>
                    <p class="text-[9px] font-black uppercase tracking-[0.2em] text-emerald-400 mt-1" id="userRoleBadge">FACILITADOR DHO</p>
                </div>
                <div class="w-14 h-14 bg-emerald-500/10 rounded-full flex items-center justify-center text-emerald-400 shadow-inner overflow-hidden border border-emerald-500/20 group-hover:rotate-12 transition-transform">
                    <i data-lucide="gem" class="w-7 h-7"></i>
                </div>
            </div>

            <div class="space-y-5 mb-8" id="global-kpis"></div>

            <div class="w-full space-y-4 mt-auto pt-8 border-t border-white/10">
                <button onclick="HA.Api.fetchCloudData()" class="w-full py-4 bg-white/5 hover:bg-white/10 text-white text-[10px] font-black uppercase tracking-[0.2em] rounded-2xl border border-white/10 transition-all flex items-center justify-center gap-2 shadow-lg">
                    <i data-lucide="satellite" class="w-4 h-4 text-mustard-500"></i> Radar Nuvem
                </button>
                <button onclick="HA.Auth.logout()" class="w-full py-4 bg-rose-500/10 hover:bg-rose-500 text-rose-400 hover:text-white text-[10px] font-black uppercase tracking-[0.2em] rounded-2xl border border-rose-500/20 transition-all flex items-center justify-center gap-2">
                    <i data-lucide="log-out" class="w-4 h-4"></i> Desconectar
                </button>
            </div>
        </aside>
    </div>

    <!-- CONTAINERS DOS MODAIS -->
    <div id="modalFichaContainer" class="fixed inset-0 bg-navy-950/90 flex items-center justify-center hidden z-50 p-2 sm:p-4 backdrop-blur-xl animate-fade-in"></div>
    <div id="modalHistory" class="fixed inset-0 bg-navy-950/90 flex items-center justify-center hidden z-50 p-4 backdrop-blur-xl animate-fade-in"></div>

    <!-- MODAL: EDITAR COLAB (EXCLUSIVO FACILITADOR) -->
    <div id="modalColab" class="fixed inset-0 bg-navy-950/90 flex items-center justify-center hidden z-[60] p-4 backdrop-blur-xl animate-fade-in">
        <div class="bg-navy-900/80 backdrop-blur-2xl rounded-[2.5rem] shadow-[0_30px_60px_rgba(0,0,0,0.8)] w-full max-w-lg overflow-hidden border border-white/10 animate-slide-up relative">
            <div class="absolute top-0 left-0 right-0 h-[1px] bg-gradient-to-r from-transparent via-indigo-500/50 to-transparent pointer-events-none"></div>
            <div class="bg-navy-950/50 px-8 py-6 flex justify-between items-center border-b border-white/10">
                <h2 id="modalColabTitle" class="text-xs font-black uppercase tracking-[0.2em] text-indigo-400 flex items-center gap-3">Editar Colaborador</h2>
                <button type="button" onclick="HA.UI.closeModal('modalColab')" class="text-gray-500 hover:text-white transition bg-white/5 p-2 rounded-full"><i data-lucide="x" class="w-4 h-4"></i></button>
            </div>
            <form onsubmit="HA.Facilitator.saveColab(event)" class="p-8 space-y-6">
                <input type="hidden" id="c-spId">
                <div class="flex items-center gap-5 bg-black/30 p-5 rounded-3xl border border-white/5 shadow-inner">
                    <div id="photoPreviewBox" class="w-20 h-20 rounded-full bg-white/5 flex items-center justify-center overflow-hidden border-2 border-white/10 shadow-md flex-shrink-0">
                        <i data-lucide="camera" class="w-8 h-8 text-gray-500"></i>
                    </div>
                    <div class="flex-1 overflow-hidden">
                        <label class="label-clean">Atualizar Foto Perfil</label>
                        <input type="file" accept="image/*" onchange="HA.Facilitator.compressPhoto(event)" class="text-xs text-gray-400 file:mr-3 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-[10px] file:font-bold file:bg-indigo-600/80 file:text-white hover:file:bg-indigo-500 cursor-pointer transition w-full">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-5">
                    <div><label class="label-clean">Matrícula</label><input type="number" id="c-id" required class="input-clean"></div>
                    <div><label class="label-clean">Status</label><select id="c-status" class="input-clean cursor-pointer"><option value="Ativo">Ativo</option><option value="Desligado">Desligado</option></select></div>
                </div>
                <div><label class="label-clean">Nome Completo</label><input type="text" id="c-name" required class="input-clean"></div>
                <div class="grid grid-cols-2 gap-5">
                    <div><label class="label-clean">Líder Alocado</label><input type="text" id="c-leader" required class="input-clean"></div>
                    <div>
                        <label class="label-clean">Setor Principal</label>
                        <select id="c-sector" required class="input-clean cursor-pointer">
                            <option value="Recebimento">Recebimento</option><option value="Armazenagem">Armazenagem</option>
                            <option value="Separação">Separação</option><option value="Expedição">Expedição</option>
                            <option value="Produção">Produção</option>
                        </select>
                    </div>
                </div>
                <div class="pt-4 flex gap-4">
                    <button type="button" onclick="HA.UI.closeModal('modalColab')" class="flex-1 bg-white/5 text-white py-4 rounded-2xl text-[10px] font-black uppercase tracking-[0.1em] hover:bg-white/10 transition-colors">Cancelar</button>
                    <button type="submit" class="flex-1 bg-gradient-to-r from-indigo-600 to-indigo-500 text-white py-4 rounded-2xl text-[10px] font-black uppercase tracking-[0.1em] hover:scale-[1.02] active:scale-[0.98] transition-all shadow-[0_10px_30px_-10px_rgba(79,70,229,0.5)] flex justify-center items-center gap-2"><i data-lucide="save" class="w-4 h-4"></i> Salvar na Base</button>
                </div>
            </form>
        </div>
    </div>

    <!-- SCRIPTS MANTENIDOS INTACTOS PARA TU LOGICA -->
    <script src="js/core/app.config.js"></script>
    <script src="js/core/api.service.js"></script>
    <script src="js/core/auth.service.js"></script>
    <script src="js/components/ui.components.js"></script>
    <script src="js/controllers/facilitator.controller.js"></script>
</body>
</html>
